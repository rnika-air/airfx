# Nightly database backup. The dump is ENCRYPTED with BACKUP_PASSPHRASE before
# it is stored as a workflow artifact, because artifacts of a public repository
# can be downloaded by others. Keep the passphrase somewhere safe: without it
# the backups cannot be opened. Uploaded files (projects, media) live in
# Supabase Storage and are not part of this dump: see docs/DEPLOYMENT.md › Backups.
name: Database backup
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Dump and encrypt
        run: |
          set -euo pipefail
          test -n "$BACKUP_PASSPHRASE" || { echo "Set the BACKUP_PASSPHRASE secret first."; exit 1; }
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          stamp=$(date -u +%Y-%m-%dT%H%M)
          mkdir backup
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" -f backup/schema.sql
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --data-only -f backup/data.sql
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --role-only -f backup/roles.sql
          tar -czf - backup | gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o "airfx-db-$stamp.tar.gz.gpg"
          rm -rf backup
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: airfx-db-${{ env.STAMP }}
          path: airfx-db-*.tar.gz.gpg
          retention-days: 30
