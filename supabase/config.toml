# Supabase CLI settings. The hosted project's auth settings (site URL, redirect
# URLs, email templates, SMTP) are set in its dashboard: see docs/DEPLOYMENT.md.
project_id = "airfx"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:4173"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[storage]
enabled = true
file_size_limit = "2GiB"
